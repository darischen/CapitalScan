version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: capitalscan-postgres
    environment:
      POSTGRES_USER: capscan
      POSTGRES_PASSWORD: capscan
      POSTGRES_DB: capitalscan
      POSTGRES_INITDB_ARGS: >
        -c shared_buffers=1GB
        -c work_mem=32MB
        -c maintenance_work_mem=512MB
        -c effective_cache_size=4GB
        -c max_parallel_workers=8
        -c max_connections=200
    # Bound to explicit addresses, not the default "5432:5432".
    #
    # The bare form publishes on 0.0.0.0 **and** [::], and these machines
    # have globally routable IPv6 addresses -- IPv6 has no NAT, so the only
    # thing between that listener and the internet is the router's inbound
    # firewall. Naming the interfaces removes the IPv6 listener entirely
    # rather than relying on a default to filter it.
    #
    # **`pg_hba.conf` cannot do this job.** Docker NATs every inbound
    # connection through the bridge gateway, so a request from this host,
    # from the Pi, or from outside all arrive as 172.18.0.1. Postgres cannot
    # tell them apart by source address; scoping pg_hba to 192.168.1.0/24
    # locked out localhost and restricted nothing (2026-08-24).
    #
    # **Loopback only.** The Pi serves; it never reaches back here. `cscan
    # sync` runs on this machine and connects *out* to the Pi, so nothing
    # needs to reach this database from the LAN and the listener is bound
    # as narrowly as it can be. A 192.168.1.14 binding was added and then
    # removed once the architecture settled -- add it back only if some
    # job genuinely moves off this machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - capitalscan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capscan -d capitalscan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  capitalscan-data:
    name: capitalscan-data
