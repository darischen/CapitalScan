name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        working-directory: capitalscan
        run: uv sync

      - name: Ruff check
        working-directory: capitalscan
        run: uv run ruff check .

      - name: Ruff format
        working-directory: capitalscan
        run: uv run ruff format --check .

      - name: MyPy
        working-directory: capitalscan
        run: uv run mypy core/

      - name: Pytest unit and property
        working-directory: capitalscan
        run: uv run pytest tests/unit tests/property -v

  slow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capscan
          POSTGRES_PASSWORD: capscan
          POSTGRES_DB: capitalscan
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        working-directory: capitalscan
        run: uv sync

      - name: Pytest golden and integration
        working-directory: capitalscan
        env:
          DATABASE_URL_RESEARCH: postgresql://capscan:capscan@localhost:5432/capitalscan
        run: uv run pytest tests/golden tests/integration -v
