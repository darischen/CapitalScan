<rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>
<text x="70" y="32" font-size="20" font-weight="bold" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">Drawdown slice -- edge vs. drawdown bucket (ADR 015)</text>
<text x="70" y="54" font-size="13" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">config_hash=86e91448a65aa40b  split=train  target_pct=0.03  horizon_days=5</text>
<text x="70" y="80" font-size="12" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">ADR 015 hypothesis: edge is positive and stable in the 0-10% and 10-20% drawdown buckets, and turns negative</text>
<text x="70" y="95" font-size="12" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">past 35% drawdown -- because a deep mega-cap drawdown is usually a thesis break, not a routine dip. If it</text>
<text x="70" y="110" font-size="12" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">holds, the rule is: trade shallow dips, stand down on deep ones.</text>
<text x="70" y="129" font-size="12" font-weight="bold" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">Measured answer: MEASURED, MIXED: of 9 rendered 0-10/10-20 cells, 0 have an edge interval entirely above</text>
<text x="70" y="144" font-size="12" font-weight="bold" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">zero, 0 entirely below, 9 cross it. The shallow half of the hypothesis is not uniformly confirmed. The deep</text>
<text x="70" y="159" font-size="12" font-weight="bold" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">half (20-35/35+ turning negative) is UNTESTABLE under this grid: ADR 101 measured that population directly</text>
<text x="70" y="174" font-size="12" font-weight="bold" fill="#111111" style="font-family:'DejaVu Sans Mono','Consolas',monospace">and every such cell fell short of min_n_eff=30.</text>
