[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capitalscan"
version = "0.2.0"
description = "Bollinger Band + Stochastic Oscillator event-study engine for US mega-cap equities"
requires-python = ">=3.13"
authors = [{name = "Daris Chen", email = "arcriumurnior@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "yfinance>=0.2.30",
    "pandas-market-calendars>=4.3.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",  # pandas.read_html backend for the Wikipedia membership fetcher
    "pyarrow>=13.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.2.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "testcontainers[postgres]>=3.7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pandas-stubs>=2.0.0",
]
# The multi-task distributional model (research/neural.py). Optional
# because nothing in the shipped pipeline needs it: the pure distribution
# arithmetic lives in core/distributions.py and imports only numpy, so the
# CLI, the fast test tier and CI all run without a 2GB wheel.
neural = [
    "torch>=2.6.0",
]

[project.scripts]
cscan = "capitalscan.jobs.cli:app"

[tool.setuptools.packages.find]
# Not `packages = ["capitalscan"]` — that lists only the top level, so a
# wheel would ship an empty package with core/, jobs/, research/, handlers/,
# and mcp/ all missing. Editable installs mask it; the first build would not.
include = ["capitalscan*"]
# Tests run from the repo, never from an installed wheel.
exclude = ["capitalscan.tests*"]

[tool.pytest.ini_options]
testpaths = ["capitalscan/tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    # The exit invariants are what TESTS.md §3.4 and the Phase 3 gate name
    # specifically. The slow tier runs these at `full` (10,000 examples) and
    # everything else at `ci_fast`, which is what keeps it inside budget.
    "exit_invariant: exit resolver invariants, run at the full profile in CI",
]

[tool.mypy]
# Matches `requires-python` and every machine that runs this code. It did
# not always: this read 3.12 against a 3.11 floor, to parse numpy 2.5's
# PEP 695 `type` statements in its bundled stubs -- but CI ran the 3.11
# *interpreter*, which resolves numpy 2.4.6 and never sees those stubs at
# all. `python_version` tells mypy which syntax to assume; it does not
# change which numpy `uv` installs. Those are separate knobs and only the
# interpreter moves the dependency set.
python_version = "3.13"
packages = ["capitalscan"]
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_market_calendars.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
# `extend-exclude`, not `exclude`: the latter REPLACES ruff's defaults
# (.venv, build, dist, __pycache__, ...) rather than adding to them.
#
# `docs/sessions/session-9-backtest/` holds archived session evidence — task
# reports whose fenced Python blocks record what the code looked like at the
# time. Ruff formats code blocks inside Markdown, so leaving this in scope
# means the formatter rewrites historical evidence to match today's style,
# which destroys the thing the reports exist to preserve.
#
# It is declared rather than left to discovery because the two disagree by
# platform: `ruff format --check .` walked 158 files on this Windows
# workstation and 208 in CI's Linux container, the difference being exactly
# these 50 files. CI failed on six of them (2026-08-09) while every local
# run passed. Whatever the traversal rule is, CI parity should not depend
# on it.
#
# Path updated 2026-08-18: these moved from `.superpowers/sdd/` into
# `docs/sessions/`, and the move made the problem *worse* before this line
# followed them. Ruff skips hidden directories by default, so `.superpowers`
# was doubly protected; `docs/` is walked normally, and the same six files
# came straight back — this time on the Windows run too.
extend-exclude = ["docs/sessions/session-9-backtest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["capitalscan"]
